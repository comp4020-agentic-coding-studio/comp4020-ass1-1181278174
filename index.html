<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No ant knows the map. The road appears anyway — and heals itself when you break it.</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#stage">Skip to the simulation</a>
    <header>
      <nav aria-label="Primary">
        <a href="#stage">Try it</a>
        <a href="#reading">Reading</a>
      </nav>
      <h1>No ant knows the map. The road appears anyway — and heals itself when you break it.</h1>
    </header>

    <main>
      <!-- The canvas is a picture, not a control: role="img", not focusable.
           The one verb has a real button in the controls (Decision 15), and
           tapping the highlighted wall does the same thing. -->
      <canvas
        id="stage"
        tabindex="0"
        aria-label="Open ground. A blue disc on the left is the nest, a green disc on the right is the food. The Scene buttons lay out nothing, a scatter of small blocks, or a maze with several ways through. Four hundred ants move between them — black while searching, red while carrying food — and the scent they leave marks the ground they use. Drag across the field to build a wall, and drag along a wall to rub it out. From the keyboard: arrow keys move a cursor, Enter builds or removes a wall there, Escape hides the cursor."
      ></canvas>

      <ul class="legend" aria-label="What you are looking at">
        <li><span class="dot ant"></span>an ant</li>
        <li><span class="dot carrying"></span>carrying food</li>
        <li><span class="dot to-food"></span>scent to food</li>
        <li><span class="dot to-home"></span>scent home</li>
      </ul>

      <!-- One column beside the canvas at desktop, the next block in the stack at
           390 — either way, reading → strip → controls (Decision 14). -->
      <div class="side">
      <section id="reading" class="readout">
        <p id="readout" class="number" aria-live="polite">no reading yet</p>
        <p id="readout-note" class="note">warming up</p>
        <p id="share" class="note secondary">walls: 0</p>
        <canvas
          id="strip"
          class="strip"
          role="img"
          aria-label="How the reading has moved over time."
        ></canvas>
      </section>

      <section class="controls" aria-label="Controls">
        <div class="scene" role="group" aria-label="Scene">
          <span class="scene-label">Scene</span>
          <button id="scene-blank" type="button" aria-pressed="true">Blank — draw your own</button>
          <button id="scene-random" type="button" aria-pressed="false">Random obstacles</button>
          <button id="scene-maze" type="button" aria-pressed="false">Maze</button>
        </div>

        <div class="slider">
          <label for="rho">Forgetting rate — <b id="rho-value">0.020</b></label>
          <input id="rho" type="range" min="0" max="0.05" step="0.001" value="0.02" />
          <div class="ends" aria-hidden="true">
            <span>never forget</span><span>forget everything</span>
          </div>
        </div>

        <div class="slider">
          <label for="speed">Speed — <b id="speed-value">150</b> steps per second</label>
          <input id="speed" type="range" min="30" max="300" step="10" value="150" />
          <div class="ends" aria-hidden="true">
            <span>slow</span><span>fast</span>
          </div>
        </div>

        <div class="buttons">
          <button id="clear" type="button" hidden>Clear walls</button>
          <button id="run" type="button" aria-pressed="true">Run</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </section>
      </div>

      <!-- Slice 5 fills this: eight sentences, ≤ 65ch (Decision 14). -->
      <div class="prose"></div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
