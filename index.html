<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The colony's intelligence is in how fast it forgets</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#stage">Skip to the simulation</a>
    <header>
      <nav aria-label="Primary">
        <a href="#stage">Try it</a>
        <a href="#reading">Reading</a>
      </nav>
      <h1>The colony's intelligence is in how fast it forgets</h1>
    </header>

    <main>
      <!-- The canvas is a picture, not a control: role="img", not focusable.
           The one verb has a real button in the controls (Decision 15), and
           tapping the highlighted wall does the same thing. -->
      <canvas
        id="stage"
        role="img"
        aria-label="A field of open ground with a wall down the middle and a few solid blocks. A blue disc on the left is the nest, a green disc on the right is the food. Four hundred ants move between them, and the scent they leave glows on the ground they use. The wall has a gap in it, closed, directly between the two."
      ></canvas>

      <ul class="legend" aria-label="What you are looking at">
        <li><span class="dot ant"></span>an ant</li>
        <li><span class="dot to-food"></span>scent to food</li>
        <li><span class="dot to-home"></span>scent home</li>
      </ul>

      <!-- One column beside the canvas at desktop, the next block in the stack at
           390 — either way, reading → strip → controls (Decision 14). -->
      <div class="side">
      <section id="reading" class="readout">
        <p id="readout" class="number" aria-live="polite">no reading yet</p>
        <p id="readout-note" class="note">warming up</p>
        <p id="share" class="note secondary">the gap is shut</p>
        <canvas
          id="strip"
          class="strip"
          role="img"
          aria-label="How the reading has moved over time, with the moment the shortcut opened marked."
        ></canvas>
      </section>

      <section class="controls" aria-label="Controls">
        <button id="wall" type="button" aria-pressed="false">
          Open the gap in the wall
        </button>

        <div class="slider">
          <label for="rho">Forgetting rate — <b id="rho-value">0.010</b></label>
          <input id="rho" type="range" min="0" max="0.05" step="0.001" value="0.01" />
          <div class="ends" aria-hidden="true">
            <span>never forget</span><span>forget everything</span>
          </div>
        </div>

        <div class="buttons">
          <button id="run" type="button" aria-pressed="false">Pause</button>
          <button id="reset" type="button">Reset</button>
          <button id="grow" type="button" hidden>Watch it grow</button>
        </div>
      </section>
      </div>

      <!-- Slice 5 fills this: eight sentences, ≤ 65ch (Decision 14). -->
      <div class="prose"></div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
